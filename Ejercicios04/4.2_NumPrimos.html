
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Práctica 2 - Números primos</title>
</head>
<body>

    <h1>Números primos del 1 al 1000</h1>

    <script>
        function esPrimo(numero) {

            if (numero < 2) {
                return false;
            }

            for (let i = 2; i < numero; i++) {
                if (numero % i === 0) {
                    return false;
                }
            }

            return true;
        }

        for (let i = 1; i <= 1000; i++) {
            if (esPrimo(i)) {
                document.write(i + " ");
            }
        }
    </script>

</body>
</html>
